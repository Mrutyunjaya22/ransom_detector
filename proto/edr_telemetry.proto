syntax = "proto3";

package edr.telemetry;

// ==========================================
// EDR Telemetry & Command Stream Service
// ==========================================
service EDRTelemetryService {
  // Registers a remote endpoint agent with the SOC server
  rpc RegisterAgent (AgentInfo) returns (RegistrationResponse);

  // High-throughput bidirectional telemetry and containment stream
  rpc StreamTelemetry (stream TelemetryBatch) returns (stream MitigationDirective);

  // Periodic heartbeat keep-alive
  rpc SendHeartbeat (Heartbeat) returns (HeartbeatAck);
}

// Endpoint registration metadata
message AgentInfo {
  string agent_id = 1;
  string hostname = 2;
  string ip_address = 3;
  string os_platform = 4;
  string agent_version = 5;
}

message RegistrationResponse {
  string status = 1;          // "registered", "approved", "rejected"
  string assigned_id = 2;
  string session_token = 3;
  int32 heartbeat_interval_sec = 4;
}

// Agent Heartbeat
message Heartbeat {
  string agent_id = 1;
  double timestamp = 2;
  float cpu_usage_percent = 3;
  float memory_usage_percent = 4;
  int32 monitored_processes_count = 5;
}

message HeartbeatAck {
  bool acknowledged = 1;
  double server_timestamp = 2;
}

// Granular File System Telemetry Event
message FileEvent {
  enum EventType {
    UNKNOWN = 0;
    CREATE = 1;
    MODIFY = 2;
    DELETE = 3;
    MOVE = 4;
  }
  EventType event_type = 1;
  string path = 2;
  string dest_path = 3;
  double timestamp = 4;
  float entropy = 5;
  bool is_suspicious_ext = 6;
  int32 process_id = 7;
}

// Granular Process Execution Metric
message ProcessMetric {
  int32 pid = 1;
  string process_name = 2;
  string cmdline = 3;
  float cpu_percent = 4;
  float io_bytes_per_s = 5;
  int32 threads_count = 6;
  int32 children_count = 7;
  double timestamp = 8;
}

// Aggregated High-Performance Telemetry Batch
message TelemetryBatch {
  string agent_id = 1;
  string batch_id = 2;
  double timestamp = 3;
  repeated FileEvent file_events = 4;
  repeated ProcessMetric process_metrics = 5;
}

// Threat Mitigation Directive streamed from Server to Agent
message MitigationDirective {
  enum ActionType {
    ACTION_UNSPECIFIED = 0;
    SUSPEND = 1;
    TERMINATE = 2;
    KILL = 3;
    ISOLATE_HOST = 4;
  }
  string directive_id = 1;
  int32 target_pid = 2;
  ActionType action = 3;
  string reason = 4;
  float risk_score = 5;
  double timestamp = 6;
}
